name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests
      - name: Smoke scan example
        run: PYTHONPATH=src python3 -m agent_context_lab scan examples/conflicting-agent-repo --format markdown --fail-under 50
